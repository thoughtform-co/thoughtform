name: verify

on:
  pull_request:
  push:
    branches: [main]

# Cancel an in-flight run when a new commit lands on the same ref.
# Lint + typecheck + unit tests are cheap; running them once per
# tip is enough.
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint + typecheck + unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          # Pinned to the runtime Vercel deploys with (same major as
          # the repo's @types/node devDependency).
          node-version: 20
          cache: npm

      - name: Install dependencies
        # `--ignore-scripts` is the supply-chain baseline declared in
        # `.npmrc` and the Sentinel `npm-supply-chain-defense` skill;
        # passing it explicitly keeps CI consistent with the Vercel
        # `installCommand` (`vercel.json`) regardless of how npm
        # resolves the rc files.
        run: npm install --legacy-peer-deps --ignore-scripts

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:run

      # Catches route-table regressions (e.g. / accidentally turning
      # dynamic), broken imports that only surface at build time, and
      # prerender crashes. No env vars on purpose: the landing page's
      # seed fallbacks must keep a cold build green — if this step
      # fails without env, a fallback path broke.
      - name: Production build
        run: npm run build

  # Corridor DOM-contract smokes (Phase 5 CI hardening). The corridor's
  # attribute writers live inside the WebGL frameloop; these assert the
  # ADR-018/021/022 contracts across all four viewport projects. CI
  # WebGL is SwiftShader — the corridorCapable() automation carve-out
  # (ADR-038) keeps the 3D corridor mounted under navigator.webdriver,
  # and playwright.config forces workers=1 in CI (no GPU starvation).
  # Playwright's webServer starts the dev server itself.
  corridor-smokes:
    name: Corridor smokes (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install --legacy-peer-deps --ignore-scripts

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Corridor + device-matrix smokes
        run: npx playwright test tests/visual/landing-corridor-smoke.spec.ts tests/visual/corridor-device-matrix-smoke.spec.ts --reporter=list

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failures
          path: test-results/
          retention-days: 7

  # react-doctor scoped to NEW issues only (--scope changed diffs
  # against the PR base) — safe on a legacy-heavy repo: pre-existing
  # findings never fail the build, newly introduced ones do.
  react-doctor:
    name: react-doctor (new issues only)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          # Full history so --scope changed can diff against the base.
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install --legacy-peer-deps --ignore-scripts

      - name: react-doctor (changed scope)
        run: npx react-doctor@0.7.7 . --scope changed --no-supply-chain --yes
