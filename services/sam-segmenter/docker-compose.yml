version: "3.8"
services:
  sam-segmenter:
    build: .
    ports:
      - "8001:8001"
    volumes:
      - ./checkpoints:/app/checkpoints
    environment:
      - SAM_MODEL_TYPE=vit_b
      - SAM_CHECKPOINT_PATH=/app/checkpoints/sam_vit_b.pth
